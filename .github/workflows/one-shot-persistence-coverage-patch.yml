name: One-shot persistence coverage patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/deterministic-persistence-coverage
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install constrained test environment
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Apply exact persistence coverage transformation
        run: python tools/_one_shot_patch_persistence_coverage.py
      - name: Verify deterministic persistence regressions
        run: python -m pytest -q tests/test_persistence_coverage_determinism.py
      - name: Commit exact source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/layers/system_rebuild_sim.py
          git diff --cached --check
          git commit -m "Make persistence assumption coverage deterministic"
          git push origin HEAD:agent/deterministic-persistence-coverage
