name: Publish v0.4.4 release (temporary)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.4.4.yml"

permissions:
  contents: write

concurrency:
  group: publish-v0.4.4-release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Validate, build, and publish v0.4.4
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 4f05a4994f882fcab9ba0d467ba9bc6aed467ee7
      RELEASE_TAG: v0.4.4

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v5
        with:
          ref: 4f05a4994f882fcab9ba0d467ba9bc6aed467ee7
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and release tooling
        run: python3 -m pip install -e '.[dev]' build

      - name: Verify immutable tag target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [[ "${tag_sha}" != "${RELEASE_SHA}" ]]; then
            echo "${RELEASE_TAG} points to ${tag_sha}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Validate tag, package, and changelog versions
        run: python3 scripts/check_release_version.py --tag "${RELEASE_TAG}"

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Run static safety audit
        run: python3 shenron.py run all --dry-run

      - name: Build distributions
        run: python3 -m build

      - name: Create release or upload verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* --verify-tag --title "SHENRON ${RELEASE_TAG}" --generate-notes
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          grep -Fxq 'shenron-0.4.4-py3-none-any.whl' <<<"${assets}"
          grep -Fxq 'shenron-0.4.4.tar.gz' <<<"${assets}"
