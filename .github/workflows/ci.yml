name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  html-cli:
    name: HTML report CLI (exclusions and fail-closed inputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: |
          python -m pip install -c constraints/ci.txt -e '.[dev]'
          python -m pip check
      - name: Verify both real HTML CLI entry points with synthetic demo evidence
        run: python -m pytest tests/test_html_report_cli.py -q

  assumption-cli:
    name: Qualified assumption CLI (exit and schema contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: |
          python -m pip install -c constraints/ci.txt -e '.[dev]'
          python -m pip check
      - name: Verify exact CLI exit and schema contracts
        run: python -m pytest tests/test_assumption_cli_exit_contract.py -q

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python3 -m pytest tests/ -q

  minimum-dependencies:
    name: Minimum declared dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install declared minimum direct dependencies
        run: |
          python -m pip install \
            'setuptools==68.0.0' \
            wheel \
            'pyyaml==6.0.3' \
            'pysigma==1.3.0' \
            'requests==2.32.5' \
            'pytest==7.0.0' \
            'Faker==18.0.0'
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify minimum dependency consistency
        run: python -m pip check

      - name: Run full test suite at declared minima
        run: python -m pytest tests/ -q

  safety:
    name: Safety controls and audit-bundle generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run dry-run (all canonical layers)
        run: python3 shenron.py run all --dry-run

      - name: Generate canonical demo artifact for strict safety evaluation
        run: |
          mkdir -p /tmp/shenron_ci_demo
          python3 scripts/generate_demo_artifacts.py --out-dir /tmp/shenron_ci_demo

      - name: Schema validation on canonical generated artifact
        run: python3 shenron.py schema validate --events /tmp/shenron_ci_demo/shenron_demo_run.jsonl

      - name: Generate audit bundle (overclaim findings remain reported)
        run: |
          python3 shenron.py audit bundle \
            --events /tmp/shenron_ci_demo/shenron_demo_run.jsonl \
            --rules sigma/rules \
            --assumptions assumptions/examples \
            --out /tmp/shenron_audit

      - name: Enforce nested safety and documented legacy exclusions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("/tmp/shenron_audit")
          safety = json.loads((out / "safety_verification.json").read_text())
          exclusions = json.loads((out / "assumption_exclusions.json").read_text())
          assumptions = json.loads((out / "assumption_results.json").read_text())
          assert safety["verdict"] == "PASS", safety
          assert len(exclusions) == 2, exclusions
          assert len(assumptions) == 17, len(assumptions)
          assert all(row["reason"] == "legacy_format_not_validated" for row in exclusions)
          PY

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build setuptools wheel

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation

      - name: Verify wheel installs against CI constraints
        run: |
          pip install -c constraints/ci.txt dist/*.whl
          python -m pip check
          shenron --help

  drift:
    name: MITRE ATT&CK drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check MITRE ATT&CK drift
        run: |
          mkdir -p .cache
          python3 shenron.py --check-mitre-drift --drift-cache .cache/attack_bundle.json

  assumptions:
    name: Assumption coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      # Positive identity seed recorded by PRs #50/#51; the fixed-identity job
      # below retains the known-negative and near-miss controls.
      - name: Generate and strictly validate seeded scoped assumption evidence
        run: python3 shenron.py --validate-all-assumptions --seed 2026110500 --scope-dir /tmp/shenron_scoped

      - name: Verify scoped coverage and identity signal consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from core.assumptions.loader import load_artifacts
          from core.assumptions.validator import _artifact_signals, validate_assumption
          from core.cli.commands.validate_all import CATEGORY_ASSUMPTIONS
          from research.identity_ci_gate import CLAIM, TARGET, OTHER_CLAIMS

          for category, assumption_path in CATEGORY_ASSUMPTIONS.items():
              evidence = Path("/tmp/shenron_scoped") / f"shenron_{category}.jsonl"
              if not evidence.is_file() or evidence.stat().st_size == 0:
                  raise SystemExit(f"FAIL {category}: absent or empty scoped evidence")
              records = load_artifacts(evidence)
              if not records:
                  raise SystemExit(f"FAIL {category}: zero scoped records")
              result = validate_assumption(assumption_path, evidence)
              if category != "identity":
                  if result.status.value != "SUPPORTED":
                      raise SystemExit(f"FAIL {category}: {result.status.value}")
                  print(f"PASS {category}: SUPPORTED")
                  continue

              claims = {item.claim.id: item.status.value for item in result.claim_results}
              required = set(OTHER_CLAIMS) | {CLAIM}
              if len(result.claim_results) != len(required) or set(claims) != required:
                  raise SystemExit(f"FAIL identity: changed/missing claims: {claims}")
              if any(claims[name] != "SUPPORTED" for name in OTHER_CLAIMS):
                  raise SystemExit(f"FAIL identity: non-target claim regression: {claims}")
              present = any(TARGET in _artifact_signals(row) for row in records)
              expected_target = "SUPPORTED" if present else "UNSUPPORTED"
              expected_category = "SUPPORTED" if present else "PARTIALLY_SUPPORTED"
              expected_supported = 4 if present else 3
              expected_unsupported = 0 if present else 1
              if (
                  claims[CLAIM] != expected_target
                  or result.status.value != expected_category
                  or result.supported_count != expected_supported
                  or result.unsupported_count != expected_unsupported
                  or result.out_of_scope_violations
              ):
                  raise SystemExit(
                      "FAIL identity: inconsistent evidence/status "
                      f"signal_present={present}, claims={claims}, status={result.status.value}"
                  )
              print(
                  f"PASS identity diagnostic: {result.status.value} "
                  f"(trusted_name_rename_sim_present={present}); "
                  "deterministic positive and negative controls run separately"
              )
          PY

      - name: Diagnose exact assumption signals
        if: always()
        run: |
          for category in payload identity; do
            file="/tmp/shenron_scoped/shenron_${category}.jsonl"
            if [ -f "$file" ]; then
              python scripts/diagnose_assumption_signals.py "$category" "$file" > "/tmp/shenron_scoped/${category}_diagnostic.json"
              cat "/tmp/shenron_scoped/${category}_diagnostic.json"
            else
              echo "Missing scoped artifact for $category"
            fi
          done

      - name: Upload scoped assumption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assumption-evidence
          path: /tmp/shenron_scoped/
          if-no-files-found: warn

  fixed-identity:
    name: Current-code seeded identity contract (positive, negative, near-miss)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install constrained dependencies
        run: |
          python -m pip install -c constraints/ci.txt -e '.[dev]'
          python -m pip check

      - name: Verify passive default
        run: python research/identity_ci_gate.py --output-dir /tmp/shenron_fixed

      - name: Verify known positive, negative, repeated and near-miss controls
        run: python research/identity_ci_gate.py --execute --output-dir /tmp/shenron_fixed

      - name: Validate all seven categories with qualified positive identity fixture
        run: python3 shenron.py --validate-all-assumptions --no-rerun --scope-dir /tmp/shenron_fixed

      - name: Preserve current-code fixture evidence and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-code-identity-evidence
          path: /tmp/shenron_fixed/
          retention-days: 90
          if-no-files-found: warn
