name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python3 -m pytest tests/ -q

  minimum-dependencies:
    name: Minimum declared dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install declared minimum direct dependencies
        run: |
          python -m pip install \
            'setuptools==68.0.0' \
            wheel \
            'pyyaml==6.0.3' \
            'pysigma==1.3.0' \
            'requests==2.32.5' \
            'pytest==7.0.0' \
            'Faker==18.0.0'
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify minimum dependency consistency
        run: python -m pip check

      - name: Run full test suite at declared minima
        run: python -m pytest tests/ -q

  safety:
    name: Safety audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run dry-run (all canonical layers)
        run: python3 shenron.py run all --dry-run

      - name: Schema validation on demo artifact
        run: python3 shenron.py schema validate --events artifacts/demo/shenron_demo_run.jsonl

      - name: Stage canonical assumptions; audit legacy exclusions explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          from core.assumptions.loader import load_assumption

          src = Path("assumptions/examples")
          target = Path("/tmp/shenron_canonical_assumptions")
          target.mkdir(parents=True, exist_ok=True)
          legacy = {"c2_lateral_coverage.yaml", "assumption_dependency_confusion.yaml"}
          all_files = sorted(src.glob("*.yaml"))
          found = {p.name for p in all_files}
          if not legacy <= found:
              raise SystemExit("Expected legacy specimens are missing; review the CI selection")

          selected = 0
          for path in all_files:
              if path.name in legacy:
                  try:
                      _, _, claims = load_assumption(path)
                  except (TypeError, ValueError) as exc:
                      print(f"EXPECTED INVALID LEGACY {path.name}: {exc}")
                  else:
                      if claims:
                          raise SystemExit(f"Legacy file now parses as claims: {path}")
                      print(f"EXPECTED INERT LEGACY {path.name}: no executable claims")
                  continue

              _, _, claims = load_assumption(path)
              if not claims:
                  raise SystemExit(f"Unexpected zero-claim canonical assumption: {path}")
              copy2(path, target / path.name)
              selected += 1

          if selected != len(all_files) - len(legacy) or not selected:
              raise SystemExit("Canonical assumption selection count mismatch")
          print(f"EXPLICIT AUDIT SCOPE: {selected} canonical assumptions; "
                f"{len(legacy)} legacy examples excluded and checked")
          PY

      - name: Audit bundle (canonical assumptions only)
        run: |
          python3 shenron.py audit bundle \
            --events artifacts/demo/shenron_demo_run.jsonl \
            --rules sigma/rules \
            --assumptions /tmp/shenron_canonical_assumptions \
            --out /tmp/shenron_audit

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build setuptools wheel

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation

      - name: Verify wheel installs against CI constraints
        run: |
          pip install -c constraints/ci.txt dist/*.whl
          python -m pip check
          shenron --help

  drift:
    name: MITRE ATT&CK drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check MITRE ATT&CK drift
        run: |
          mkdir -p .cache
          python3 shenron.py --check-mitre-drift --drift-cache .cache/attack_bundle.json

  assumptions:
    name: Assumption coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Validate all category assumptions
        run: python3 shenron.py --validate-all-assumptions --scope-dir /tmp/shenron_scoped

      - name: Diagnose exact assumption signals
        if: always()
        run: |
          for category in payload identity; do
            file="/tmp/shenron_scoped/shenron_${category}.jsonl"
            if [ -f "$file" ]; then
              python scripts/diagnose_assumption_signals.py "$category" "$file" > "/tmp/shenron_scoped/${category}_diagnostic.json"
              cat "/tmp/shenron_scoped/${category}_diagnostic.json"
            else
              echo "Missing scoped artifact for $category"
            fi
          done

      - name: Upload scoped assumption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assumption-evidence
          path: /tmp/shenron_scoped/
          if-no-files-found: warn
