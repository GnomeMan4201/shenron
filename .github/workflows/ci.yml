name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python3 -m pytest tests/ -q

  safety:
    name: Safety audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run dry-run (all canonical layers)
        run: python3 shenron.py run all --dry-run

      - name: Schema validation on demo artifact
        run: python3 shenron.py schema validate --events artifacts/demo/shenron_demo_run.jsonl

      - name: Audit bundle
        run: |
          python3 shenron.py audit bundle \
            --events artifacts/demo/shenron_demo_run.jsonl \
            --rules sigma/rules \
            --assumptions assumptions/examples \
            --out /tmp/shenron_audit

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build setuptools wheel

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation

      - name: Verify wheel installs against CI constraints
        run: |
          pip install -c constraints/ci.txt dist/*.whl
          python -m pip check
          shenron --help

  drift:
    name: MITRE ATT&CK drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check MITRE ATT&CK drift
        run: |
          mkdir -p .cache
          python3 shenron.py --check-mitre-drift --drift-cache .cache/attack_bundle.json

  assumptions:
    name: Assumption coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: pip install -c constraints/ci.txt -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Validate all category assumptions
        run: python3 shenron.py --validate-all-assumptions
