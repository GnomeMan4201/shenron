name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy shenron_core || true
      - run: pytest -q
