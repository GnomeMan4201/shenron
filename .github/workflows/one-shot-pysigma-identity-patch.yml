name: One-shot pySigma identity patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/preserve-source-sigma-identity
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install constrained test environment
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Apply exact bridge transformation
        run: python tools/_one_shot_patch_pysigma_identity.py
      - name: Verify focused source-identity regressions
        run: python -m pytest -q tests/test_pysigma_identity.py
      - name: Commit exact bridge patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/sigma/pysigma_bridge.py
          git diff --cached --check
          git commit -m "Preserve source Sigma identity through pySigma bridge"
          git push origin HEAD:agent/preserve-source-sigma-identity
