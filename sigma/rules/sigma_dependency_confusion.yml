title: Dependency Confusion Supply Chain Attack Behavioral Cluster
id: dep-confusion-phantom-001
status: experimental
description: >
  Detects synthetic telemetry patterns consistent with npm dependency confusion
  supply chain attacks: postinstall hook abuse, inflated version numbers,
  spoofed package metadata, C2 callback during install, tmpdir payload drop,
  detached child process, and environment variable reconnaissance.
  Designed for validation against SHENRON dependency_confusion_phantom layer output.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-02
references:
  - https://github.com/GnomeMan4201/shenron
  - https://www.microsoft.com/en-us/security/blog/2026/05/29/33-malicious-npm-packages-abuse-dependency-confusion-profile-developer-environments/
tags:
  - attack.t1195.001
  - attack.t1059.007
  - attack.t1071.001
  - attack.t1036.005
  - attack.t1082
  - attack.t1552.001
  - attack.initial_access
  - attack.execution
  - attack.defense_evasion
logsource:
  category: shenron_simulation
  product: dependency_confusion_phantom
detection:
  selection_postinstall:
    behavior_class: postinstall_hook_declared
    detail.detection_signal: npm_postinstall_script_execution

  selection_version:
    behavior_class: namespace_squatting
    detail.detection_signal: inflated_version_number

  selection_metadata:
    behavior_class: namespace_squatting
    detail.detection_signal_2: spoofed_package_metadata

  selection_ci_evasion:
    behavior_class: ci_environment_detection
    detail.detection_signal: ci_environment_detection_attempt

  selection_cache:
    behavior_class: cache_directory_creation
    detail.detection_signal: cache_dedup_directory_creation

  selection_traversal:
    behavior_class: project_root_traversal
    detail.detection_signal: project_root_traversal

  selection_c2:
    behavior_class: outbound_connection_during_npm_install
    detail.detection_signal: outbound_connection_during_npm_install

  selection_secret_header:
    behavior_class: outbound_connection_during_npm_install
    detail.detection_signal_2: hardcoded_auth_header_in_outbound_request

  selection_drop:
    behavior_class: payload_dropped_to_tmpdir
    detail.detection_signal: payload_dropped_to_tmpdir

  selection_detached:
    behavior_class: payload_dropped_to_tmpdir
    detail.detection_signal_2: detached_child_process_from_npm

  selection_recon:
    behavior_class: environment_variable_enumeration
    detail.detection_signal: environment_variable_enumeration

  condition: 1 of selection_*

falsepositives:
  - Legitimate packages with postinstall hooks (node-gyp, husky, etc.)
    — validate against known-good package inventory
  - Internal packages with high version numbers in private registries
    — scope-lock internal registries via .npmrc to eliminate false positives
level: high
fields:
  - artifact_id
  - layer
  - phase
  - behavior_class
  - detail.detection_signal
  - detail.package_sim
  - detail.version_sim
  - detail.c2_url_sim
  - detail.drop_path_sim
  - detail.cache_dir_sim
