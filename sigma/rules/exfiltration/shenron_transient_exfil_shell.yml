title: Ephemeral Exfiltration Shell Behavioral Cluster
id: shenron-transient-exfil-shell-001
status: experimental
description: >
  Detects synthetic telemetry patterns consistent with transient exfiltration:
  ephemeral high-port TCP listeners with single lifecycle, outbound connections
  on non-standard ports from non-network processes, and data transfer followed
  immediately by socket close.
  Designed for validation against SHENRON transient_exfil_sim layer output.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-22
references:
  - https://github.com/GnomeMan4201/shenron
tags:
  - attack.t1041
  - attack.t1048
  - attack.exfiltration
logsource:
  category: shenron_simulation
  product: transient_exfil_sim
detection:
  # Observable-only (see docs/OBSERVABLE_FIELDS.md): a one-shot listener,
  # an outbound transfer that closes its socket, and a prompt port release.
  selection_one_shot_listener:
    lifecycle_sim: one_shot
    listen_backlog_sim: 1
    bind_addr_sim|exists: true
  selection_outbound_transfer:
    remote_addr_sim|exists: true
    data_size_bytes_sim|exists: true
    socket_closed_after_sim|exists: true
  selection_port_release:
    port_released_sim|exists: true
    cleanup_delay_sim|exists: true
  condition: 1 of selection_*
falsepositives:
  - Ephemeral service ports in microservice architectures
  - Legitimate data transfer utilities (rsync, scp)
level: high
fields:
  - artifact_id
  - layer
  - phase
  - behavior_class
  - detection_opportunities
  - simulation_only
