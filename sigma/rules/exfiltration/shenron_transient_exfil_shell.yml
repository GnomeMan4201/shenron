title: Ephemeral Exfiltration Shell Behavioral Cluster
id: shenron-transient-exfil-shell-001
status: experimental
description: >
  Detects synthetic telemetry patterns consistent with transient exfiltration:
  ephemeral high-port TCP listeners with single lifecycle, outbound connections
  on non-standard ports from non-network processes, and data transfer followed
  immediately by socket close.
  Designed for validation against SHENRON transient_exfil_sim layer output.
