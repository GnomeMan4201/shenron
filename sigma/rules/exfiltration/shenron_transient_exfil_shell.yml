title: Ephemeral Exfiltration Shell Behavioral Cluster
id: shenron-transient-exfil-shell-001
status: experimental
description: >
  Detects synthetic telemetry patterns consistent with transient exfiltration:
  ephemeral high-port TCP listeners with single lifecycle, outbound connections
  on non-standard ports from non-network processes, and data transfer followed
  immediately by socket close.
  Designed for validation against SHENRON transient_exfil_shell layer output.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-02
references:
  - https://github.com/GnomeMan4201/shenron
tags:
  - attack.t1041
  - attack.t1048
  - attack.exfiltration
logsource:
  category: shenron_simulation
  product: transient_exfil_shell
detection:
  selection_spawn:
    layer: transient_exfil_shell
    phase: shell_spawn_sim

  selection_transfer:
    layer: transient_exfil_shell
    phase: data_transfer_sim

  selection_dissolve:
    layer: transient_exfil_shell
    phase: shell_dissolve_sim

  condition: 1 of selection_*

falsepositives:
  - Ephemeral service ports in microservice architectures — validate against service mesh policy
  - Legitimate data transfer utilities (rsync, scp) — correlate with authorized transfer schedule
level: high
fields:
  - artifact_id
  - layer
  - phase
  - behavior_class
  - detection_opportunities
