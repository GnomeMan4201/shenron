title: SHENRON C2 Beacon Detection
id: shenron-c2-001
status: test
description: >
    Detects periodic C2 beacons from what the traffic shows: a beacon interval
    plus an HTTP or DNS beacon method. Matches observable fields only, never
    simulator labels (see docs/OBSERVABLE_FIELDS.md).
author: gnomeman4201 / badBANANA Research Collective
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.t1132
logsource:
    product: shenron
    category: simulation
detection:
    selection:
        beacon_interval_sim|exists: true
        beacon_data.method:
            - http_get
            - http_post
            - https_encoded
            - dns_a
            - dns_txt
    condition: selection
level: high
