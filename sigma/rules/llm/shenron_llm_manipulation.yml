title: SHENRON LLM Manipulation Attack Chain
id: shenron-llm-manipulation-001
status: experimental
description: >
  Detects the full LLM manipulation kill chain simulated by SHENRON:
  prompt injection, hallucination injection, obfuscation, and output exfiltration.
  Covers reconnaissance through exfiltration across all three LLM attack layers.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-25
references:
  - https://github.com/GnomeMan4201/shenron
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
  - attack.t1059.007
  - attack.t1190
  - attack.t1027
  - attack.t1565
  - attack.t1565.001
  - attack.t1036
  - attack.t1048
  - attack.t1590
  - shenron.llm_manipulation
logsource:
  product: shenron
  category: simulation
detection:
  # Observable-only (see docs/OBSERVABLE_FIELDS.md): what the simulated
  # activity shows, not the layer, behavior or technique it was labelled with.
  selection_prompt_injection:
    injection_technique_sim|exists: true
    prompt_shape_sim|exists: true
  selection_model_probe:
    target_model_sim|exists: true
    token_count_sim|exists: true
  selection_trace_log_setup:
    target_log_sim|exists: true
    planned_traces_sim|exists: true
  selection_hallucination_trace:
    log_tag_sim: '[LLM-HALLUCINATION]'
    hallucination_class_sim|exists: true
  selection_layered_encoding:
    overall_entropy_sim|exists: true
    depth|exists: true
  condition: 1 of selection_*
falsepositives:
  - Authorized LLM security testing and red team exercises
  - SHENRON synthetic telemetry validation runs
  - Legitimate LLM application logging with verbose mode enabled
level: high
fields:
  - artifact_id
  - session_id
  - scenario_id
  - layer
  - phase
  - behavior_class
  - signal
  - detection_opportunities
  - mitre_techniques
  - injection_technique_sim
  - target_model_sim
  - simulation_only
