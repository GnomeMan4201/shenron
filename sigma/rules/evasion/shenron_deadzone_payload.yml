title: Payload Staging in Hidden World-Writable Directory Behavioral Cluster
id: shenron-deadzone-payload-001
status: experimental
description: >
  Detects synthetic telemetry patterns consistent with payload staging:
  hidden directory creation in world-writable paths containing high-entropy files,
  non-logging processes writing marker files, and cross-process reads of staged files.
  Designed for validation against SHENRON deadzone_payload layer output.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-02
references:
  - https://github.com/GnomeMan4201/shenron
tags:
  - attack.t1027
  - attack.t1140
  - attack.defense_evasion
logsource:
  category: shenron_simulation
  product: deadzone_payload
detection:
  selection_zone_init:
    layer: deadzone_payload
    phase: zone_init

  selection_staging:
    layer: deadzone_payload
    phase: staging

  selection_log_marker:
    layer: deadzone_payload
    phase: log_marker

  condition: 1 of selection_*

falsepositives:
  - Package managers staging in /tmp — validate against known-good package manager process list
  - Build systems with high-entropy artifacts — correlate with CI/CD pipeline process tree
level: medium
fields:
  - artifact_id
  - layer
  - phase
  - behavior_class
  - detection_opportunities
