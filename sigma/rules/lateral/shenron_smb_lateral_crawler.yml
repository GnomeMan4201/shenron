  - attack.t1021.001
  - attack.t1021.002
  - attack.t1021.004
  - attack.t1550
  - attack.t1557
  - attack.t1558
  - attack.lateral_movement
logsource:
  category: shenron_simulation
  product: smb_lateral_crawler
detection:
  selection_smb_admin_share:
    layer: smb_lateral_crawler
    phase: smb_admin_share
  selection_rdp_lateral:
    layer: smb_lateral_crawler
    phase: rdp_lateral
  selection_pass_the_hash:
    layer: smb_lateral_crawler
    phase: pass_the_hash
  selection_ssh_lateral:
    layer: smb_lateral_crawler
