title: SHENRON SMB Lateral Crawler
id: shenron-smb-lateral-crawler-001
status: experimental
description: >
  Detects lateral movement activities simulated by SHENRON covering
  SMB admin share access, RDP lateral movement, pass-the-hash,
  SSH lateral movement, and Kerberoasting.
author: GnomeMan4201 / badBANANA Research Collective
date: 2026-06-22
references:
  - https://github.com/GnomeMan4201/shenron
tags:
