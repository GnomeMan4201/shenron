id: execution_coverage
schema_version: "1.0"
description: Validates scoped synthetic payload execution telemetry; external journald interpreter spawns are checked separately

claims:
  - id: scripting_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1059
    requires_signals:
      - script_execution_sim
      - interpreter_inline_exec_sim

  - id: scheduled_exec_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1547
    requires_signals:
      - staging
      - shell_spawn_sim

  - id: no_lateral_overclaim
    type: out_of_scope_claim
    severity: medium
    requires_techniques:
      - T1021
      - T1570
