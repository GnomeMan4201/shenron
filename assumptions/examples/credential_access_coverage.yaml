id: credential_access_coverage
description: Validates artifact contains credential access telemetry

claims:
  - id: credential_dump_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1003
    requires_signals:
      - credential_dump_sim
      - lsass_access_sim

  - id: brute_force_evidence
    type: positive_evidence
    severity: medium
    requires_techniques:
      - T1110
    requires_signals:
      - brute_force_attempt_sim
      - auth_failure_burst_sim

  - id: no_c2_overclaim
    type: out_of_scope_claim
    severity: high
    requires_techniques:
      - T1071
      - T1095
