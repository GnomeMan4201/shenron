id: identity_spoofing_coverage
schema_version: "1.0"
description: Validates artifact contains identity and token spoofing telemetry

claims:
  - id: token_impersonation_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1542
    requires_signals:
      - bios_log_forge_sim
      - synthetic_device_fingerprint_emit_sim

  - id: process_injection_identity_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1542
    requires_signals:
      - bios_tamper_log_write_sim
      - trusted_name_rename_sim

  - id: no_exfil_overclaim
    type: out_of_scope_claim
    severity: high
    requires_techniques:
      - T1041
      - T1048
