id: entropy_evasion_coverage
schema_version: "1.0"
description: Validates artifact contains entropy manipulation and obfuscation telemetry

claims:
  - id: high_entropy_output_evidence
    type: positive_evidence
    severity: medium
    description: Entropy layers emit high-entropy logging and source-mismatch telemetry
    requires_techniques:
      - T1027
    requires_signals:
      - log_files_high_entropy_non_logging_process
      - synthetic_entropy_mismatch_real_sources_sim

  - id: hash_staging_evidence
    type: positive_evidence
    severity: medium
    description: Entropy layers emit hash-based staging and filename telemetry
    requires_signals:
      - hash_renamed_binaries_temp_hidden_dir
      - high_entropy_filename_no_source_sim

  - id: timing_anomaly_evidence
    type: positive_evidence
    severity: medium
    description: Entropy layers emit burst-timing and sleep-jitter telemetry
    requires_signals:
      - timing_fingerprint_entropy_burst_sim
      - sleep_jitter_from_non_timer_process

  # Entropy and command-and-control techniques can legitimately overlap.
  # Scope boundaries are enforced through category-scoped artifacts.
