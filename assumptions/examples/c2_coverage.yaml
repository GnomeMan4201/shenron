id: c2_coverage
description: Validates artifact contains C2 channel-shaped telemetry

claims:
  - id: beacon_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1071
    requires_signals:
      - periodic_beacon_to_external_host
      - http_beacon_sim

  - id: covert_channel_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1095
      - T1572
    requires_signals:
      - covert_channel_traffic
      - dns_tunneling_high_entropy

  - id: no_persistence_overclaim
    type: out_of_scope_claim
    severity: medium
    requires_techniques:
      - T1053
    requires_signals:
      - scheduled_task_creation
