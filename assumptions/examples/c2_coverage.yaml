id: c2_coverage
schema_version: "1.0"
description: Validates artifact contains C2 channel-shaped telemetry

claims:
  - id: beacon_evidence
    type: positive_evidence
    severity: high
    description: Artifact contains application layer C2 telemetry
    requires_techniques:
      - T1071

  - id: covert_channel_evidence
    type: positive_evidence
    severity: high
    description: Artifact contains covert channel / tunneling telemetry
    requires_techniques:
      - T1095
      - T1572

  - id: no_persistence_overclaim
    type: out_of_scope_claim
    severity: medium
    description: This artifact should not be used to claim persistence detection
    requires_techniques:
      - T1053
      - T1547
      - T1055
