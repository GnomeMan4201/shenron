id: persistence_coverage
description: Validates artifact contains persistence mechanism telemetry

claims:
  - id: scheduled_task_evidence
    type: positive_evidence
    severity: medium
    requires_techniques:
      - T1053
    requires_signals:
      - scheduled_task_creation
      - cron_modification_sim

  - id: autostart_evidence
    type: positive_evidence
    severity: medium
    requires_techniques:
      - T1547
    requires_signals:
      - autostart_registry_modification_sim

  - id: process_injection_evidence
    type: positive_evidence
    severity: high
    requires_techniques:
      - T1055
    requires_signals:
      - process_injection_attempt_sim

  - id: no_c2_overclaim
    type: out_of_scope_claim
    severity: high
    requires_techniques:
      - T1071
    requires_signals:
      - periodic_beacon_to_external_host

  - id: no_exfil_overclaim
    type: out_of_scope_claim
    severity: high
    requires_techniques:
      - T1041
