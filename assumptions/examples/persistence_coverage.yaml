name: persistence_coverage_assumption
description: >
  Claims that our detection stack can observe persistence-shaped adversarial telemetry.
  This assumption covers scheduled task, service install, and registry run-key signals.

claims:
  - "We can observe persistence-shaped telemetry"
  - "We can detect suspicious scheduled task behavior"
  - "We can detect service creation shape"
  - "We can detect registry run-key modification shape"
  - "We can detect hidden directory creation"

expected_techniques:
  - T1053.005
  - T1543.003
  - T1547.001
  - T1053
  - T1543
  - T1547

expected_signals:
  - scheduled_task_creation
  - service_install_signal
  - reg_run_key_signal
  - hidden_temp_directory
  - process_injection_attempt

expected_phases:
  - EXECUTE
  - ADAPT
