[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenron"
version = "0.4.2"
description = "Synthetic adversarial telemetry and detection brittleness scoring for detection engineers"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "gnomeman4201", email = "badbanana@proton.me"}
]
keywords = [
    "blue-team", "detection-engineering", "sigma", "mitre-attack",
    "telemetry", "simulation", "brittleness", "security", "pysigma"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pysigma>=1.3.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "Faker>=18.0",
]
export = [
    "jinja2>=3.0",
]

[project.scripts]
shenron = "shenron:main"

[project.urls]
Homepage = "https://github.com/GnomeMan4201/shenron"
Repository = "https://github.com/GnomeMan4201/shenron"
Changelog = "https://github.com/GnomeMan4201/shenron/blob/main/CHANGELOG.md"
Documentation = "https://github.com/GnomeMan4201/shenron/blob/main/docs/field_mapping.md"

[tool.setuptools]
py-modules = ["shenron"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "schemas*", "sigma*", "assumptions*", "scenarios*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
