[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenron-core"
version = "0.1.0"
description = "Adaptive red-team research framework (research-only)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="GnomeMan4201"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
osint = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "googlesearch-python>=1.3.0",
]

dev = ["pytest", "pytest-cov", "mypy", "pre-commit"]

[project.scripts]
shenron = "shenron_core.cli:main"

[tool.setuptools.packages.find]
# Explicitly include both top-level packages in this flat layout
include = ["shenron_core*", "shenron_modules*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
