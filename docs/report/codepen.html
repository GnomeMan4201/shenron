rning lamp: broke when mutated. Off: never fired.&lt;/p&gt;&lt;/div&gt;\n  &lt;div class=\&quot;stats\&quot; id=\&quot;stats\&quot;&gt;&lt;/div&gt;\n&lt;/header&gt;\n&lt;div class=\&quot;wrap\&quot;&gt;&lt;aside class=\&quot;card caveat\&quot; aria-labelledby=\&quot;cav-h\&quot; style=\&quot;margin-top:28px\&quot;&gt;&lt;h2 id=\&quot;cav-h\&quot;&gt;Read this before the durability numbers&lt;/h2&gt;&lt;ul&gt;\n        &lt;li&gt;The rule hit counts on the 50 demo events are solid. Two independent reviews reproduced them.&lt;/li&gt;\n        &lt;li&gt;The scenario scores come from SHENRON&#x27;s campaign brittleness scorer, and the reviews found four defects in it. The biggest: it checked every event in a stage before mutation but only the single mutated event after, so a rule still firing on a sibling event counted as evaded. Fixing that alone takes all six scenarios to 0.00. It also counted stages no rule detected as evasion, only mutated the &lt;code&gt;layer&lt;/code&gt; field, and drew seeds that changed between runs. With all four fixed in &lt;a href=\&quot;https://github.com/GnomeMan4201/shenron/pull/71\&quot;&gt;PR #71&lt;/a&gt;, all six scenarios score 0.00 in three runs, so the scenario ranking is withdrawn.&lt;/li&gt;\n        &lt;li&gt;The mutation rounds and per-rule scores come from a different code path, and they reproduce exactly with and without PR #71. They are accurate but narrow: the only detection field any round changed was &lt;code&gt;layer&lt;/code&gt;. They show which rules depend on that one label, not how rules hold up against real attacker variation.&lt;/li&gt;\n        &lt;li&gt;0.00 isn&#x27;t proof of durability either. The rules still match on labels the mutator never changes. &lt;a href=\&quot;https://github.com/GnomeMan4201/shenron/pull/72\&quot;&gt;PR #72&lt;/a&gt; pilots rules that match on simulated observables instead.&lt;/li&gt;\n      &lt;/ul&gt;&lt;/aside&gt;&lt;/div&gt;\n&lt;main class=\&quot;wrap\&quot;&gt;\n  &lt;div class=\&quot;stack\&quot;&gt;\n\n    &lt;div class=\&quot;grid2\&quot;&gt;\n      &lt;section id=\&quot;rack\&quot; class=\&quot;card\&quot; aria-labelledby=\&quot;rack-h\&quot;&gt;\n        &lt;h2 id=\&quot;rack-h\&quot;&gt;Every rule, tested against the same 50 events&lt;/h2&gt;\n        &lt;p class=\&quot;sub\&quot;&gt;Each tile is one Sigma rule, grouped by folder. Select one to see its verdict and source.&lt;/p&gt;\n        &lt;div class=\&quot;rack\&quot; id=\&quot;rackEl\&quot; role=\&quot;group\&quot; aria-label=\&quot;Sigma rules\&quot;&gt;&lt;/div&gt;\n        &lt;div class=\&quot;legend\&quot;&gt;\n          &lt;span&gt;&lt;i class=\&quot;sw held\&quot;&gt;&lt;/i&gt;Kept firing every round&lt;/span&gt;\n          &lt;span&gt;&lt;i class=\&quot;sw evaded\&quot;&gt;&lt;/i&gt;Stopped after mutation&lt;/span&gt;\n          &lt;span&gt;&lt;i class=\&quot;sw idle\&quot;&gt;&lt;/i&gt;Never fired&lt;/span&gt;\n        &lt;/div&gt;\n      &lt;/section&gt;\n      &lt;section class=\&quot;card detail\&quot; id=\&quot;detail\&quot; aria-live=\&quot;polite\&quot; aria-label=\&quot;Selected rule\&quot;&gt;&lt;/section&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\&quot;grid2\&quot;&gt;\n      &lt;section id=\&quot;adapt\&quot; class=\&quot;card\&quot; aria-labelledby=\&quot;adapt-h\&quot;&gt;\n        &lt;h2 id=\&quot;adapt-h\&quot;&gt;Eight rounds of adaptive mutation&lt;/h2&gt;\n        &lt;p class=\&quot;sub\&quot;&gt;Each round, SHENRON scores mutation strategies by how many fields of the still-firing rules they target, favours ones it hasn&#x27;t used, applies the winner to all 50 events and re-runs the rules. Mutations build on each other. Bars show the four rules that fired before mutation.&lt;/p&gt;\n        &lt;ol class=\&quot;rounds\&quot; id=\&quot;rounds\&quot;&gt;&lt;/ol&gt;\n        &lt;div class=\&quot;outcome\&quot; id=\&quot;outcome\&quot;&gt;&lt;/div&gt;\n      &lt;/section&gt;\n      &lt;section id=\&quot;scenarios\&quot; class=\&quot;card\&quot; aria-labelle ot;${r.state}\&quot; aria-pressed=\&quot;false\&quot; aria-label=\&quot;${esc(r.name)}: ${sr}\&quot;&gt;${couponSVG(r,i)}&lt;/button&gt;`;\n  }).join(&#x27;&#x27;)}&lt;/div&gt;&lt;span class=\&quot;gname\&quot;&gt;${esc(label(g))}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);\n\nfunction showRule(i){\n  const r = R[i];\n  document.querySelectorAll(&#x27;.coupon&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, b.dataset.i == i));\n  const verdict = {\n    held: `&lt;span class=\&quot;verdict-held\&quot;&gt;Kept firing.&lt;/span&gt; Fired ${r.hits}\u00d7 on the demo events and kept firing through all ${D.adapt.iters.length} mutation rounds. It also matches on &lt;code&gt;mitre_technique&lt;/code&gt;, which no round mutated, so this isn&#x27;t evidence of durability.`,\n    evaded: `&lt;span class=\&quot;verdict-evaded\&quot;&gt;Evaded.&lt;/span&gt; Fired ${r.hits}\u00d7 on the demo events, then stopped firing once mutation began.`,\n    fired: `Fired ${r.hits}\u00d7.`,\n    idle: `Never fired. None of the ${D.events.length} demo events matched this rule&#x27;s conditions. That can mean the demo has no telemetry for it, or that the rule&#x27;s fields don&#x27;t match what the simulator emits.`\n  }[r.state];\n  $(&#x27;#detail&#x27;).innerHTML = `\n    &lt;h3&gt;${esc(r.name)}&lt;/h3&gt;\n    &lt;p class=\&quot;path\&quot;&gt;${esc(r.path)}&lt;/p&gt;\n    &lt;p style=\&quot;margin:0 0 12px\&quot;&gt;${verdict}&lt;/p&gt;\n    &lt;dl class=\&quot;facts\&quot;&gt;\n      ${r.brit != null ? `&lt;dt&gt;Mutations that stopped it&lt;/dt&gt;&lt;dd&gt;${Math.round(r.brit*7)} of 7&lt;/dd&gt;` : &#x27;&#x27;}\n      &lt;dt&gt;Level&lt;/dt&gt;&lt;dd&gt;${esc(r.level)}&lt;/dd&gt;\n      &lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;${esc(r.status)}&lt;/dd&gt;\n      &lt;dt&gt;Tactics&lt;/dt&gt;&lt;dd&gt;${esc(r.tactics.join(&#x27;, &#x27;) || &#x27;\u2014&#x27;)}&lt;/dd&gt;\n    &lt;/dl&gt;\n    ${r.desc ? `&lt;p class=\&quot;small\&quot; style=\&quot;margin:0 0 12px\&quot;&gt;${esc(r.desc)}&lt;/p&gt;` : &#x27;&#x27;}\n    &lt;div class=\&quot;chips\&quot; style=\&quot;margin-bottom:10px\&quot;&gt;${r.techs.map(t=&gt;`&lt;span class=\&quot;chip\&quot;&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;\n    &lt;details&gt;&lt;summary&gt;Rule source&lt;/summary&gt;&lt;pre&gt;${esc(r.raw)}&lt;/pre&gt;&lt;/details&gt;`;\n}\n$(&#x27;#rackEl&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; { const b = e.target.closest(&#x27;.coupon&#x27;); if (b) showRule(+b.dataset.i); });\nshowRule(R.indexOf(evaded[0] || R[0]));\n\n/* ---------- adaptation ---------- */\nconst nRules = held.length + evaded.length;\nconst pips = (on) =&gt; Array.from({length:nRules}, (_,k) =&gt; `&lt;i class=\&quot;pip ${k&lt;on?&#x27;&#x27;:&#x27;off&#x27;}\&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;);\nconst nice = s =&gt; s.replace(/^sigma_aware_/,&#x27;&#x27;).replace(/_/g,&#x27; &#x27;);\n/* What each round actually changed, measured by instrumenting the mutator at commit 6810866. */\nconst ROUND_NOTE = {1:&#x27;deleted layer from all 50 events&#x27;,2:&#x27;changed run_id, host_id or timestamp, which no rule reads&#x27;,3:&#x27;changed run_id, host_id or timestamp, which no rule reads&#x27;,4:&#x27;deleted run_id, host_id or timestamp&#x27;,5:&#x27;no change: the mutator doesn\\&#x27;t recognise this strategy name&#x27;,6:&#x27;no change: the mutator doesn\\&#x27;t recognise this strategy name&#x27;,7:&#x27;removed optional metadata such as description and note&#x27;,8:&#x27;replaced specific signal names with generic ones&#x27;};\nconst aware = (s,i) =&gt; ROUND_NOTE[i] || (s.startsWith(&#x27;sigma_aware_&#x27;) ? &#x27;sigma-aware mutation&#x27; : &#x27;generic mutation&#x27;);\n$(&#x27;#rounds&#x27;).innerHTML =\n  `&lt;li&gt;&lt;span class=\&quot;n\&quot;&gt;0&lt;/span&gt;&lt;span class=\&quot;s\&quot;&gt;No mutation&lt;small&gt;baseline&lt;/small&gt;&lt;/span&gt;&lt;span class=\&quot;pips\&quot; role=\&quot;img\&quot; aria-label=\&quot;${nRules} of ${nRules} firing\&quot;&gt;${pips(nRules)}&lt;/span&gt;&lt;/li&gt;` +\n  D.adapt.iters.map(it =&gt; `&lt;li&gt;&lt;span class=\&quot;n\&quot;&gt;${it.iteration}&lt;/span&gt;&lt;span class=\&quot;s\&quot;&gt;${esc(nice(it.strategy))}&lt;small&gt;${aware(it.strategy,it.iteration)} \u00b7 ${Math.round(it.evasion_rate*nRules)} of ${nRules} rules stopped&lt;/small&gt;&lt;/span&gt;&lt;span class=\&quot;pips\&quot; role=\&quot;img\&quot; aria-label=\&quot;${it.rules_firing_count} of ${nRules} firing\&quot;&gt;${pips(it.rules_firing_count)}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;);\n$(&#x27;#outcome&#x27;).innerHTML = `\n  &lt;div&gt;&lt;h3&gt;Still firing&lt;/h3&gt;&lt;ul&gt;${D.adapt.surviving_rules.map(n=&gt;`&lt;li&gt;${esc(n)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;\n  &lt;div&gt;&lt;h3&gt;Evaded&lt;/h3&gt;&lt;ul&gt;${D.adapt.evaded_rules.map(n=&gt;`&lt;li&gt;${esc(n)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;\n  &lt;p class=\&quot;small\&quot; style=\&quot;grid-column:1/-1;margin:0\&quot;&gt;${D.adapt.evasion_achieved ? `Full evasion after ${D.adapt.iterations_to_evasion} rounds.` : `Full evasion not reached. Round 1 deleted the &lt;code&gt;layer&lt;/code&gt; field, which stopped the two rules that need it. After that the mutator had no detection field left to target, so later rounds changed metadata that no rule reads. The two survivors also match on &lt;code&gt;mitre_technique&lt;/code&gt;, which no round touched. Rounds 5 and 6 changed nothing: at this commit their strategy names didn&#x27;t match the mutator&#x27;s, a bug fixed in PR #71.`}&lt;/p&gt;`;\n\n/* ---------- scenarios ---------- */\nconst STAGES = [&#x27;INITIAL_ACCESS&#x27;,&#x27;EXECUTION&#x27;,&#x27;PERSISTENCE&#x27;,&#x27;PRIVILEGE_ESCALATION&#x27;,&#x27;LATERAL_MOVEMENT&#x27;,&#x27;COLLECTION&#x27;,&#x27;EXFIL&#x27;];\nconst DARK = matchMedia(&#x27;(prefers-color-scheme: dark)&#x27;).matches;\n\nfunction mixHex(a,b,w){const p=h=&gt;[1,3,5].map(i=&gt;parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return &#x27;#&#x27;+A.map((x,i)=&gt;Math.round(x*w+B[i]*(1-w)).toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;);}\nfunction cell(v){\n  if (v == null) return `&lt;span class=\&quot;stage na\&quot;&gt;\u2013&lt;/span&gt;`;\n  const bg = mixHex(&#x27;#C2542F&#x27;,&#x27;#E7E5E4&#x27;,v*0.55);\n  return `&lt;span class=\&quot;stage\&quot; style=\&quot;background:${bg}\&quot;&gt;${v.toFixed(2)}&lt;/span&gt;`;\n}\nconst SC = D.scen.scenarios.slice().sort((a,b)=&gt;b.overall_brittleness-a.overall_brittleness);\n$(&#x27;#scenList&#x27;).innerHTML = SC.map(s =&gt; `\n  &lt;div class=\&quot;scen\&quot;&gt;\n    &lt;div class=\&quot;scen-head\&quot;&gt;&lt;span class=\&quot;scen-name\&quot;&gt;${esc(s.scenario_name)}&lt;/span&gt;\n    &lt;span class=\&quot;scen-num\&quot;&gt;&lt;b&gt;${s.overall_brittleness.toFixed(2)}&lt;/b&gt; brittleness&lt;br&gt;${s.triggered_count}/${s.total_stages} stages detected&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=\&quot;stages\&quot; role=\&quot;img\&quot; aria-label=\&quot;${esc(s.scenario_name)} per-stage brittleness: ${STAGES.filter(k=&gt;k in s.per_stage).map(k=&gt;k.toLowerCase().replace(/_/g,&#x27; &#x27;)+&#x27; &#x27;+s.per_stage[k].toFixed(2)).join(&#x27;, &#x27;)}\&quot;&gt;${STAGES.map(k=&gt;cell(s.per_stage[k])).join(&#x27;&#x27;)}&lt;/div&gt;\n  &lt;/div&gt;`).join(&#x27;&#x27;);\n$(&#x27;#scenNotes&#x27;).innerHTML = `\n  ${D.scen.universally_brittle_stages.length ? `&lt;p&gt;The scorer originally marked &lt;b&gt;${esc(D.scen.universally_brittle_stages.map(s=&gt;s.toLowerCase().replace(/_/g,&#x27; &#x27;)).join(&#x27;, &#x27;))}&lt;/b&gt; as brittle in every scenario that includes it.&lt;/p&gt;` : &#x27;&#x27;}\n  &lt;p&gt;&lt;b&gt;Withdrawn:&lt;/b&gt; with the fixes in PR #71, all six scenarios score 0.00 in three clean runs, and no stage is universally brittle.&lt;/p&gt;\n  &lt;p&gt;As originally reported, the ranking put &lt;b&gt;${esc(D.scen.most_brittle_scenario)}&lt;/b&gt; first and &lt;b&gt;${esc(D.scen.most_resilient_scenario)}&lt;/b&gt; last. Reruns on a clean machine moved apt29-style from 0.71 to 0.67, so the order isn&#x27;t stable yet.&lt;/p&gt;\n  &lt;p&gt;The tool&#x27;s report also names a \&quot;most effective strategy\&quot; with a rate attached. That figure is the mean scenario brittleness, and several strategies tied, so it&#x27;s left off this page.&lt;/p&gt;`;\n\n/* ---------- coverage ---------- */\nconst telem = new Set(D.events.flatMap(e =&gt; (e.mitre_techniques||[]).map(parent)));\nconst ruled = new Set(R.flatMap(r =&gt; r.techs.map(parent)));\nconst firedT = new Set(fired.flatMap(r =&gt; r.techs.map(parent)));\nconst both = [...telem].filter(t =&gt; ruled.has(t)).sort();\nconst tOnly = [...telem].filter(t =&gt; !ruled.has(t)).sort();\nconst rOnly = [...ruled].filter(t =&gt; !telem.has(t)).sort();\nconst chips = (a, cls=&#x27;&#x27;) =&gt; `&lt;div class=\&quot;chips\&quot;&gt;${a.map(t=&gt;`&lt;span class=\&quot;chip ${cls}\&quot;&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;\n$(&#x27;#covEl&#x27;).innerHTML = `\n  &lt;h3&gt;In the events and tagged on a rule (${both.length})&lt;/h3&gt;\n  &lt;p class=\&quot;small\&quot;&gt;Shaded ones are tagged on a rule that fired somewhere in the demo events.&lt;/p&gt;\n  &lt;div class=\&quot;chips\&quot;&gt;${both.map(t=&gt;`&lt;span class=\&quot;chip ${firedT.has(t)?&#x27;both&#x27;:&#x27;&#x27;}\&quot;&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;\n  &lt;h3&gt;In the events, but no rule is tagged with it (${tOnly.length})&lt;/h3&gt;\n  &lt;p class=\&quot;small\&quot;&gt;No rule even claims these. They&#x27;re the clearest gaps.&lt;/p&gt;\n  ${chips(tOnly,&#x27;gap&#x27;)}\n  &lt;h3&gt;Tagged on a rule, but absent from the demo events (${rOnly.length})&lt;/h3&gt;\n  &lt;p class=\&quot;small\&quot;&gt;The demo artifact doesn&#x27;t exercise these. Some do appear in the scenario campaigns.&lt;/p&gt;\n  ${chips(rOnly)}`;\n\n/* ---------- telemetry ---------- */\nconst MAIN = [&#x27;OBSERVE&#x27;,&#x27;SIMULATE&#x27;,&#x27;EXECUTE&#x27;,&#x27;ADAPT&#x27;];\nconst phaseOf = e =&gt; MAIN.includes(e.phase) ? e.phase : &#x27;layer-specific&#x27;;\nconst phases = [&#x27;All&#x27;, ...MAIN, &#x27;layer-specific&#x27;];\nlet cur = &#x27;All&#x27;;\nconst title = p =&gt; p === &#x27;All&#x27; ? &#x27;All&#x27; : p === &#x27;layer-specific&#x27; ? &#x27;Layer-specific&#x27; : p[0] + p.slice(1).toLowerCase();\nfunction renderFilters(){\n  $(&#x27;#filters&#x27;).innerHTML = phases.map(p =&gt; {\n    const n = p===&#x27;All&#x27; ? D.events.length : D.events.filter(e=&gt;phaseOf(e)===p).length;\n    return `&lt;button data-p=\&quot;${p}\&quot; aria-pressed=\&quot;${p===cur}\&quot;&gt;${title(p)} ${n}&lt;/button&gt;`;\n  }).join(&#x27;&#x27;);\n}\nconst SKIP = new Set([&#x27;safety&#x27;,&#x27;note&#x27;,&#x27;generator&#x27;,&#x27;event_type&#x27;,&#x27;run_id&#x27;,&#x27;session_id&#x27;,&#x27;simulation_only&#x27;,&#x27;artifact_id&#x27;]);\nfunction renderEvents(){\n  const list = D.events.filter(e =&gt; cur===&#x27;All&#x27; || phaseOf(e)===cur);\n  $(&#x27;#events&#x27;).innerHTML = list.map(e =&gt; {\n    const idx = D.events.indexOf(e);\n    const fields = Object.entries(e).filter(([k,v]) =&gt; !SKIP.has(k) &amp;&amp; typeof v !== &#x27;object&#x27;);\n    const safe = e.safety ? Object.entries(e.safety).map(([k,v]) =&gt; `&lt;span class=\&quot;chip\&quot;&gt;${esc(k.replace(/_/g,&#x27; &#x27;))}: ${v}&lt;/span&gt;`).join(&#x27;&#x27;) : &#x27;&#x27;;\n    return `&lt;div class=\&quot;evt\&quot;&gt;&lt;button aria-expanded=\&quot;false\&quot; aria-controls=\&quot;ev${idx}\&quot; data-i=\&quot;${idx}\&quot;&gt;\n      &lt;span class=\&quot;seq\&quot;&gt;${e.sequence ?? idx+1}&lt;/span&gt;\n      &lt;span&gt;&lt;span class=\&quot;l\&quot;&gt;${esc(e.layer)}&lt;/span&gt;&lt;span class=\&quot;m\&quot;&gt;${esc(e.phase)} \u00b7 ${esc(e.signal || e.behavior_class || &#x27;&#x27;)} \u00b7 ${(e.mitre_techniques||[]).join(&#x27;, &#x27;)}&lt;/span nst open = b.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;\n  b.setAttribute(&#x27;aria-expanded&#x27;, !open);\n  document.getElementById(&#x27;ev&#x27;+b.dataset.i).hidden = open;\n});\nrenderFilters(); renderEvents();\n\n/* ---------- footer ---------- */\nconst when = new Date(D.generated_at).toLocaleString(undefined, {dateStyle:&#x27;medium&#x27;, timeStyle:&#x27;short&#x27;});\n$(&#x27;#foot&#x27;).innerHTML = `\n  &lt;p&gt;Snapshot of SHENRON at commit &lt;code&gt;${esc(D.commit)}&lt;/code&gt;, captured ${esc(when)}. Every number on this page comes from the tool&#x27;s own output, and each was rerun and checked against the code on Nov 14, 2026, at this commit and with PR #71 applied. Rule verdicts and per-rule mutation counts come from &lt;code&gt;/api/validate&lt;/code&gt; and mutation rounds from &lt;code&gt;run_adaptation&lt;/code&gt;, both run on &lt;code&gt;artifacts/demo/shenron_demo_run.jsonl&lt;/code&gt;. Scenarios come from &lt;code&gt;shenron.py compare-scenarios&lt;/code&gt;, which generates its own campaigns.&lt;/p&gt;\n  &lt;p&gt;Synthetic telemetry does not establish real-world detector effectiveness. This page shows how rules behave on SHENRON&#x27;s own simulated events.&lt;/p&gt;\n  &lt;p&gt;&lt;a href=\&quot;https://github.com/GnomeMan4201/shenron\&quot;&gt;github.com/GnomeMan4201/shenron&lt;/a&gt;&lt;/p&gt;`;\n&quot;, &quot;editors&quot;: &quot;100&quot;, &quot;layout&quot;: &quot;top&quot;}"><button type="submit">Create pen</button></form>
